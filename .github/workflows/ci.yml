name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install quality tools
        run: python -m pip install --upgrade pip -r requirements-dev.txt
      - name: Compile sources
        run: python -m compileall -q engine.py runtime.py adapters.py portfolio_pipeline.py telemetry.py tests
      - name: Lint
        run: ruff check . --output-format=github
      - name: Run tests with coverage
        run: |
          coverage run -m unittest discover -s tests -v
          coverage report --fail-under=85
      - name: Smoke test workflow
        run: python engine.py
      - name: Validate cross-project imports
        run: python -c "import adapters, portfolio_pipeline, telemetry; assert portfolio_pipeline.SCHEMA_VERSION == 'portfolio-evidence/v1'"
