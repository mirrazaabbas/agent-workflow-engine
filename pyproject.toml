[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-workflow-engine"
version = "1.0.0"
description = "Explicit, testable orchestration primitives for reliable AI-agent workflows."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Mir Raza Abbas"}]
keywords = ["ai-agents", "orchestration", "workflow", "reliability", "human-in-the-loop"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
observability = [
  "opentelemetry-sdk>=1.28,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.28,<2",
]

[project.scripts]
agent-workflow = "agent_workflow_engine.cli:main"

[project.urls]
Homepage = "https://github.com/mirrazaabbas/agent-workflow-engine"
Repository = "https://github.com/mirrazaabbas/agent-workflow-engine"
Issues = "https://github.com/mirrazaabbas/agent-workflow-engine/issues"

[tool.setuptools]
package-dir = {agent_workflow_engine = "src/agent_workflow_engine"}
py-modules = [
  "engine",
  "runtime",
  "adapters",
  "portfolio_pipeline",
  "telemetry",
  "production",
  "mcp",
  "observability",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.coverage.run]
branch = true
source = [
  "engine",
  "runtime",
  "adapters",
  "portfolio_pipeline",
  "telemetry",
  "production",
  "mcp",
]

[tool.coverage.report]
show_missing = true
exclude_also = [
  "def main\\(\\) -> None:",
  "if __name__ == .__main__.:",
]
